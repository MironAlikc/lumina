name: lumina
description: "Lumina - Premium Advanced Commodity & Budget Tracker."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.3
  flutter_local_notifications: ^18.0.1
  fl_chart: ^0.70.0
  supabase_flutter: ^2.8.0
  uuid: ^4.5.3
  get_it: ^8.0.0
  go_router: ^14.6.2
  share_plus: ^10.1.2
  flutter_animate: ^4.5.0
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  mobile_scanner: ^7.4.2
  http: ^1.2.2
  local_auth: ^2.3.0
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  generate: true
  uses-material-design: true
  config:
    enable-swift-package-manager: false